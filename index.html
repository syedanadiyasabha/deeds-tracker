<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DEEDS-TRACKER</title>
</head>

<body>
    <h1>DEEDS-TRACKER</h1>
     <p id="welcome">Assalamu alaikum warahmatulla ! Welcome.</p>
    <div id="app"></div>

    <script>
// 1.Deeds array ;
    
        const deeds = [
            {
                section: "Fard / Obligatory",
                group: "Five daily prayers",
                items: ["Fajr", "Zohr", "Asr", "Maghrib", "Isha"]
            },
            {
                section: "Zikr",
                group: "After Fajr",
                items: ["Quran Recitation",
                    "Subhanallahi wa bihamdihi  subhanallahil azeem,astaghfirullah (100x)",
                    "La ilaha illallahu wahdahu la sharika lahu, lahul-mulku wa lahul-hamdu, wa huwa 'ala kulli shay'in  qadir (100x)"]
            },
            {
                section: "Zikr",
                group: "Before Zohr",
                items: ["Subhanallah (10x)",
                    "Alhamdulillah (10x)",
                    "AllahuAkbar (10x)"]
            },
            {
                section: "Zikr",
                group: "After Zohr",
                items: ["Darood Sharif (100X)",
                    "La ilaha illallahu muhammadur rasulullah (100X)"]
            },
            {
                section: "Zikr",
                group: "After Asar",
                items: ["Surah Al Baqarah(50 verses daily)"]
            },
            {
                section: "Zikr",
                group: "After Maghrib",
                items: ["La ilaha illallahu wahdahu la sharika lahu, lahul-mulku wa lahul-hamdu, wa huwa 'ala kulli shay'inqadir (10x)",
                    "Surah Al Waqiah"]
            },
            {
                section: "Zikr",
                group: "After Isha",
                items: ["Surah Al Mulk",
                    "Surah Al Sajda"]
            },
            {
                section: "Zikr",
                group: "Bed-Time",
                items: ["Surah Al Fatihah (4x)",
                    "Surah Al Ikhlas (3x)",
                    "Astaghfirullah (10x)",
                    "Durood (10x)",
                    "Third Kalima (4x)"]
            },
            {
                section: "Weekly Challenges",
                group: "Nafl-Prayers",
                items: ["Tahajjud",
                    "Salatul Duha",
                    "Salatul Tauba",
                    "Salatul Hajat"
                ]
            }
        ];
// 2. Build html;
        let html = "";
        let n=0;

        for (const entry of deeds) {
            html += "<h3>" + entry.section + " - " + entry.group + "</h3>";

         for (const item of entry.items) {
             html += "<label><input type='checkbox' id='c" + n + "'> " + item + "</label><br>";
             n++;
        }
    }
// 3. Show it on page;
        document.getElementById("app").innerHTML = html;

// 4. The Date key;
        const d = new Date();
        const todayKey = "deeds-" + d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();

//5. Restore saved ticks;

        const saved = JSON.parse(localStorage.getItem(todayKey) || "[]");

        for (const id of saved) {
          document.getElementById(id).checked = true;
        }

// Function to generate welcome message;

        function updateWelcome() {
            const today = new Date().toLocaleDateString("en-IN", {
            weekday: "long", day: "numeric", month: "long", year: "numeric"
    });

    let prayed = 0;
    for (let i = 0; i < 5; i++) {
        if (document.getElementById("c" + i).checked) {
        prayed++;
    }
    } 

        let message = "Assalamu alaikum! Today is " + today + ". You have prayed " + prayed + " of 5 prayers.";

        if (prayed === 5) {

            message = message + " MashaAllah, all five prayers done! May Allah accept them.";
            }

            document.getElementById("welcome").textContent = message;
         }

    updateWelcome();
//6. Save on every tick;

        document.getElementById("app").addEventListener("change", function () {
        const ticked = [];
        const boxes = document.querySelectorAll("#app input[type=checkbox]");
        for (const box of boxes) {
        if (box.checked) {
        ticked.push(box.id);
        }
  }
  localStorage.setItem(todayKey, JSON.stringify(ticked));
    
  updateWelcome();
});

    
    </script>
</body>

</html>
